# ──────────────────────────────────────────────────────
# FC Sporting United Academy – Local dev environment
# ──────────────────────────────────────────────────────
services:

  db:
    image: postgres:16-alpine
    container_name: sua_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sportingdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sua_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sportingdb}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-very-secret-key-2024}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sportingunited.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: sua_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sua_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sportingunited.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin@123}
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles: ["dev"]

volumes:
  pgdata:

